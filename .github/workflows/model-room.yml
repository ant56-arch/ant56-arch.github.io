name: Model Room

# Builds the owner-only Model Room (every model inside and out) and publishes
# it to /model-room/ behind a password. Only an encrypted copy is published;
# the password lives in the MODEL_ROOM_PASSWORD repository secret. Without
# that secret the page says it isn't set up yet.

on:
  schedule:
    - cron: "30 16 * * *"   # daily, after the morning picks runs
    - cron: "15 12 * * *"   # 8:15 AM ET (7:15 in winter): backup so the night is in before 9 AM
  # Right after each overnight scoring run (MLB/NBA/NHL/CBB/soccer in the
  # daily workflow, NFL/CFB in the picks workflow), so last night's games are
  # in by morning (Anthony, 2026-10-22: before 9 AM ET). The job skips their
  # daytime runs (see the first step).
  workflow_run:
    workflows: ["MLB, NBA and CBB Daily", "NFL and CFB Picks"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - model_room/**
      - .github/workflows/model-room.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: model-room
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Only after an overnight scoring run
        id: gate
        env:
          STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          # Runs that start 10 PM-9 AM ET (02:00-13:59 UTC) score last night's games.
          go=true
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            h=$(date -u -d "$STARTED" +%H)
            if [ "$h" -lt 2 ] || [ "$h" -ge 14 ]; then go=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "Build: $go (daily run started $STARTED)"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - name: Build the Model Room
        if: steps.gate.outputs.go == 'true'
        run: python3 model_room/build_model_room.py . dist/model-room.html

      - name: Lock it behind the password
        if: steps.gate.outputs.go == 'true'
        env:
          MODEL_ROOM_PASSWORD: ${{ secrets.MODEL_ROOM_PASSWORD }}
        run: node model_room/lock_page.mjs dist/model-room.html dist/model-room

      - name: Publish
        if: steps.gate.outputs.go == 'true'
        run: ./publish_site.sh dist/model-room:model-room
