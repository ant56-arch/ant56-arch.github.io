name: CFB Trends Probe
# Temporary: checks poll timing and builds the trends file on a work branch.
on:
  push:
    branches: ["claude/**"]
    paths: ["nfl-cfb/src/cfb_trends*.py", ".github/workflows/cfb_trends_probe.yml"]
defaults:
  run:
    working-directory: nfl-cfb
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Probe
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/cfb_trends_probe.py
