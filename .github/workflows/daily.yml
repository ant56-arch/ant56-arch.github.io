name: MLB, NBA and CBB Daily

# Picks runs refresh today's picks; later runs see posted lineups, and picks
# lock once their game starts. The 2am run grades yesterday's picks. Every run
# also runs NBA Edge (nba/predict.py), which stores finished games, grades and
# refreshes its picks on every run whatever the mode, and retrains the NBA
# model about once a week in season (nba/research/train.py). The MLB team model
# (teams/predict.py) works the same way: every run stores final scores and
# starting pitchers, grades and refreshes the game picks (locked at first
# pitch), and teams/research/train.py retrains it about once a week. CBB Edge
# (cbb/, men's college basketball) works like NBA: every run stores finished
# games and box scores, refreshes the KenPom-style ratings and picks, and
# cbb/research/train.py retrains weekly in season. NHL Edge (nhl/) works like
# NBA. Soccer Edge (soccer/: Premier League, La Liga, Champions League) does
# too: every run stores finished matches, grades, refits the club ratings and
# refreshes today's and tomorrow's picks; soccer/research/train.py retrains
# weekly with a promote-only-if-better guard. Every run rebuilds the sites
# and (on main) publishes them to the site branch GitHub Pages serves
# (publish_site.sh at the repo root).
# Times are ET converted to UTC assuming EDT (UTC-4); they run an hour early
# in EST, which only affects the offseason.

on:
  schedule:
    - cron: '7 12 * * *'    # 8:07am ET  - picks (puts today's games on the site early; hitters wait for lineups)
    - cron: '0 15 * * *'    # 11:00am ET - picks (day-game lineups are up)
    - cron: '0 20 * * *'    # 4:00pm ET  - picks (most night lineups are up)
    - cron: '30 22 * * *'   # 6:30pm ET  - picks (West Coast lineups)
    - cron: '0 6 * * *'     # 2:00am ET  - grade results
    # Backups: GitHub sometimes runs a scheduled run hours late or skips it
    # (2026-10-08 lost both the 2am and 8:07am runs). Each only builds when no
    # run has succeeded yet in its window (the guard job below). Every run,
    # results ones included, also puts today's NBA/NHL/CBB/soccer games up.
    - cron: '7 7 * * *'     # 3:07am ET  - backup results (window from 1:30am ET)
    - cron: '37 8 * * *'    # 4:37am ET  - backup results (window from 1:30am ET)
    - cron: '37 10 * * *'   # 6:37am ET  - backup picks (window from 5:30am ET)
    - cron: '37 13 * * *'   # 9:37am ET  - backup picks (window from 7am ET)
    - cron: '22 14 * * *'   # 10:22am ET - backup picks (window from 7am ET)
  workflow_dispatch:
    inputs:
      mode:
        description: "picks or results"
        type: choice
        options: [picks, results]
        default: picks

permissions:
  contents: write
  actions: write  # dispatches the MLB hitter retrain on a cold stretch; the guard lists runs

concurrency:
  group: mlb-edge
  cancel-in-progress: false

# This site's code lives in mlb-nba-cbb/ of the one Sports Edge repo.
defaults:
  run:
    working-directory: mlb-nba-cbb

# Every job is pinned to ubuntu-24.04 rather than ubuntu-latest, so GitHub's
# move of ubuntu-latest to Ubuntu 26.04 (Oct 19 - Nov 19, 2026) can't change
# the live runs underneath us. The weekly Python shadow test tries 26.04.
jobs:
  # A backup run goes ahead only if no run has succeeded yet in its window.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          go=true
          case "$SCHEDULE" in
            '7 7 * * *'|'37 8 * * *') since=05:30 ;;
            '37 10 * * *') since=09:30 ;;
            '37 13 * * *'|'22 14 * * *') since=11:00 ;;
            *) since= ;;
          esac
          if [ -n "$since" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow daily.yml --status success \
                  --created ">=$(date -u +%Y-%m-%d)T${since}:00Z" --json databaseId --jq length || echo 0)
            [ "${n:-0}" -gt 0 ] && go=false
            echo "Runs already succeeded since ${since} UTC: ${n:-0}"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      # The branch tip when this run starts, not the commit it was queued on: a
      # run waiting behind another in the mlb-edge group would otherwise start
      # from data the run before it already replaced, and its save would clash.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -r research/requirements.txt  # numpy, for the NBA retrain

      # A league whose season is over (shared/seasons.py, docs/season-end.md)
      # skips its pipeline and retrain until 10 days before its next season's
      # usual start; its pages are still rebuilt and published below. If this
      # check breaks, every league runs as usual.
      - name: Season check
        id: season
        continue-on-error: true
        run: |
          for lg in mlb nba nhl cbb soccer; do echo "$lg=$(python ../shared/seasons.py idle $lg)" >> "$GITHUB_OUTPUT"; done
          python ../shared/seasons.py

      - name: Run pipeline
        if: steps.season.outputs.mlb != 'yes'
        env:
          MODE: ${{ (github.event.schedule == '0 6 * * *' || github.event.schedule == '7 7 * * *' || github.event.schedule == '37 8 * * *') && 'results' || inputs.mode || 'picks' }}
        run: python predict.py

      # NBA Edge (nba/) rides the same schedule. Its steps can't block MLB Edge.
      - name: Run NBA pipeline
        if: steps.season.outputs.nba != 'yes'
        continue-on-error: true
        run: python nba/predict.py

      # Weekly at most, and only once enough new games have been played: refit
      # the NBA model, switching how it's built only if that wins on held-out
      # recent games. Logs every retrain to nba/model_history.json.
      - name: Retrain NBA model
        if: steps.season.outputs.nba != 'yes'
        continue-on-error: true
        run: python nba/research/train.py

      # MLB Edge's game picks (the Games tab). Like NBA, its steps can't block the hit picks.
      - name: Run MLB team pipeline
        if: steps.season.outputs.mlb != 'yes'
        continue-on-error: true
        run: python teams/predict.py

      # Weekly at most, and only once enough new games have been played: refit
      # the team model, switching how it's built only if that wins on held-out
      # recent games. Logs every retrain to teams/model_history.json.
      - name: Retrain MLB team model
        if: steps.season.outputs.mlb != 'yes'
        continue-on-error: true
        run: python teams/research/train.py

      # NHL Edge (nhl/) works like NBA: stores finals, grades, refreshes the
      # day's picks, and retrains weekly in season. Its steps can't block the others.
      - name: Run NHL pipeline
        if: steps.season.outputs.nhl != 'yes'
        continue-on-error: true
        run: python nhl/predict.py

      - name: Retrain NHL model
        if: steps.season.outputs.nhl != 'yes'
        continue-on-error: true
        run: python nhl/research/train.py

      # CBB Edge (men's college basketball). Like NBA, its steps can't block the others.
      - name: Run CBB pipeline
        if: steps.season.outputs.cbb != 'yes'
        continue-on-error: true
        run: python cbb/predict.py

      - name: Retrain CBB model
        if: steps.season.outputs.cbb != 'yes'
        continue-on-error: true
        run: python cbb/research/train.py

      # March Madness: imports the bracket from ESPN once the field is out (cbb/brackets/).
      - name: Update CBB bracket
        if: steps.season.outputs.cbb != 'yes'
        continue-on-error: true
        run: python cbb/bracket.py

      # Soccer Edge (Premier League, La Liga, Champions League). Like NBA, its
      # steps can't block the others.
      - name: Run Soccer pipeline
        if: steps.season.outputs.soccer != 'yes'
        continue-on-error: true
        run: python soccer/predict.py

      - name: Retrain Soccer model
        if: steps.season.outputs.soccer != 'yes'
        continue-on-error: true
        run: python soccer/research/train.py

      # Cold-stretch check (model_watch.py at the repo root): each sport's latest
      # live picks against what its model expected, saved to model_watch.json. The
      # game models above already retrain early on an alarm; the MLB hitter model
      # retrains in the research workflow, so this dispatches it.
      - name: Check for cold stretches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ../model_watch.py
          if [ "${GITHUB_REF_NAME}" = main ] && [ "$(python ../model_watch.py --due mlb_hits)" = yes ]; then
            gh workflow run research_pull.yml --ref main -f trigger="cold stretch"
          fi

      # How the pick moved on each game page: a row each time a game's pick,
      # chance or Vegas line changed (shared/pick_moves.py).
      - name: Save pick moves
        continue-on-error: true
        run: python ../shared/pick_moves.py daily

      # Freezes a season that just ended into archive/ (its final records).
      - name: Archive finished seasons
        continue-on-error: true
        run: python ../shared/seasons.py archive

      - name: Commit picks history
        run: |
          git config user.name "MLB Edge Bot"
          git config user.email "actions@github.com"
          git add picks_history.json nba/picks_history.json nba/data/ nba/model_weights.json
          [ -f ../model_watch.json ] && git add ../model_watch.json
          [ -d ../archive ] && git add ../archive
          [ -f nba/model_history.json ] && git add nba/model_history.json
          git add teams/picks_history.json teams/data/ teams/model_weights.json
          [ -f teams/model_history.json ] && git add teams/model_history.json
          for f in nhl/data nhl/picks_history.json nhl/model_weights.json nhl/model_history.json \
                   cbb/data cbb/brackets cbb/picks_history.json cbb/ratings.json cbb/model_weights.json cbb/model_history.json \
                   teams/pick_moves.json nba/pick_moves.json nhl/pick_moves.json cbb/pick_moves.json soccer/pick_moves.json \
                   soccer/data soccer/picks_history.json soccer/ratings.json soccer/model_weights.json soccer/model_history.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet && exit 0
          git commit -m "Update picks history $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          # If another run saved the same files first, keep its save and skip
          # this one quietly: the next run redoes this run's picks and grading.
          if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
            git rebase --abort
            git reset --hard "origin/${GITHUB_REF_NAME}"
            echo "Another run saved picks first; skipped this run's save." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push

      - name: Build site
        run: python build_site.py

      - name: Build NBA site
        continue-on-error: true
        run: python nba/build_pages.py

      - name: Build CBB site
        continue-on-error: true
        run: python cbb/build_pages.py

      - name: Build NHL site
        continue-on-error: true
        run: python nhl/build_pages.py

      - name: Build Soccer site
        continue-on-error: true
        run: python soccer/build_pages.py

      # MLB Edge's pages go to /mlb/, NBA, CBB, NHL and Soccer to theirs. A build
      # that failed leaves that sport's last published pages up.
      - name: Publish site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p out
          for s in nba cbb nhl soccer; do if [ -d "dist/$s" ]; then mv "dist/$s" "out/$s"; fi; done
          if [ -f dist/index.html ]; then mv dist out/mlb; fi
          ../publish_site.sh out/mlb:mlb out/nba:nba out/cbb:cbb out/nhl:nhl out/soccer:soccer
