name: Publish Home Page

# Publishes the home page files (the root of this repo) to the site branch
# that GitHub Pages serves, leaving every sport's pages as they are. The sport
# workflows copy the home page in on every run too; this one makes a home page
# change show up right away. Run it by hand to create the site branch.

on:
  push:
    branches: [main]
    paths:
      - index.html
      - about.html
      - bets.html
      - home-page.js
      - home-page.css
      - schedule.html
      - schedule.js
      - shared/base.css
      - shared/edge.js
      - shared/morrow.css
      - shared/assets.py
      - shared/seasons.py
      - shared/seasons.json
      - archive/**
      - terms.html
      - privacy.html
      - teams.json
      - publish_site.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Publish home page
        run: ./publish_site.sh
