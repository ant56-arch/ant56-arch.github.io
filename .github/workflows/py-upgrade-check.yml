# TEMPORARY (removed before merge): side-by-side Python 3.11 vs 3.12 run of
# every sport's pipeline, for the Python upgrade PR. Publishes and commits nothing.
name: Python upgrade check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        group: [mlb-nba-cbb, nfl-cfb]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
      - name: Run both versions and diff
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: .github/py-upgrade-check.sh ${{ matrix.group }}
