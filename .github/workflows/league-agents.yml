name: League Agents

# One read-only Claude agent per league tab plus one for the Model Room. Each
# reads its own tab's code and data and its own model, and writes a report of
# what it sees and what it would change. They only report: the agent jobs have
# a read-only token and the Read/Grep/Glob tools, nothing else. Reports are
# encrypted with the Model Room password and published at /agents/ (the repo
# is public, so they never go in issues or logs). See agents/README.md.
#
# Needs the ANTHROPIC_API_KEY secret. Leagues whose season is over are skipped.

on:
  schedule:
    - cron: "40 13 * * 2,5"   # Tuesdays and Fridays, 9:40 AM ET (8:40 in winter), after the morning picks and Model Room runs
  workflow_dispatch:
    inputs:
      agents:
        description: 'Which agents: "all" (in-season leagues) or a list like "nba,modelroom"'
        default: all

permissions:
  contents: read

concurrency:
  group: league-agents
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        env:
          AGENTS: ${{ github.event.inputs.agents || 'all' }}
        run: echo "matrix=$(python3 agents/plan.py)" >> "$GITHUB_OUTPUT"

  agent:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions:
      contents: read   # read-only on purpose: an agent can't change the repo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no token left in .git for the agent to find

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the prompt
        env:
          SLUG: ${{ matrix.slug }}
          LABEL: ${{ matrix.label }}
          PROMPT_FILE: ${{ matrix.prompt }}
        run: |
          python3 - <<'PY'
          import os
          common = open("agents/prompts/_common.md").read()
          common = common.replace("{LABEL}", os.environ["LABEL"]).replace("{SLUG}", os.environ["SLUG"].upper())
          own = open("agents/prompts/" + os.environ["PROMPT_FILE"]).read()
          open("prompt.txt", "w").write(common + "\n## Your tab\n\n" + own)
          PY

      - name: Run the agent (read-only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLUG: ${{ matrix.slug }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p reports
          out="reports/$SLUG.md"
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            printf '## %s: not set up\n\nThe ANTHROPIC_API_KEY secret is not set, so this agent did not run. Add it under Settings, Secrets and variables, Actions.\n' "$LABEL" > "$out"
            exit 0
          fi
          npm install -g @anthropic-ai/claude-code
          if ! claude -p \
              --model claude-sonnet-5-5 \
              --allowedTools "Read,Grep,Glob" \
              --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch" \
              --max-turns 40 \
              --output-format text < prompt.txt > "$out.tmp"; then
            printf '## %s: agent failed\n\nThe agent did not finish this run. See the League Agents run in the Actions tab.\n' "$LABEL" > "$out"
          else
            mv "$out.tmp" "$out"
          fi
          test -s "$out" || printf '## %s: no report\n\nThe agent returned nothing this run.\n' "$LABEL" > "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.slug }}
          path: reports/${{ matrix.slug }}.md
          retention-days: 7

  publish:
    needs: agent
    if: ${{ !cancelled() && needs.agent.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to publish to the site branch; this job never runs an agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the page
        run: python3 agents/build_report_page.py reports dist/agents.html

      - name: Lock it behind the password
        env:
          MODEL_ROOM_PASSWORD: ${{ secrets.MODEL_ROOM_PASSWORD }}
        run: node model_room/lock_page.mjs dist/agents.html dist/agents

      - name: Publish
        run: ./publish_site.sh dist/agents:agents
