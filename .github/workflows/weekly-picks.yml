name: NFL and CFB Picks

# Runs both the NFL and college football pipelines. NFL always runs; the CFB
# steps need the CFBD_API_KEY secret (a free key from
# https://collegefootballdata.com/key) and reuse the existing ODDS_API_KEY
# secret for current-week lines. Every CFB step has continue-on-error: true
# so a missing key or a CFBD hiccup can never break the NFL pipeline or the
# deploy - build_site.py already renders an empty state for a sport with no
# data yet.

on:
  workflow_dispatch:
    inputs:
      odds:
        description: "Also pull fresh Vegas lines (spends Odds API credits, 500 a month)"
        type: boolean
        default: false
  schedule:
    # Times are ET converted to UTC assuming EDT (UTC-4); after the fall DST
    # change to EST they land an hour earlier in ET. GitHub often starts
    # scheduled runs late, so the minutes are off the top of the hour, where
    # the queue is busiest. Every run rebuilds both sites. Odds API credits
    # (500 a month, about 3 per sport per fetch) only go on the runs that need
    # fresh lines: NFL at noon Sun-Fri and before the Sunday, Monday and
    # Thursday night games; CFB at noon Sun-Fri and Friday 7:15 PM while CFB
    # data is up. Other runs, and manual runs unless "odds" is ticked, reuse
    # the last lines pulled.
    # Saturday: 12 PM, 4 PM, 7 PM and 11 PM ET. CFB scores and results only;
    # its lines locked Friday at 9 PM ET (src/moneyline.py lock_times).
    - cron: "5 16,20,23 * * 6"
    - cron: "5 3 * * 0"        # Saturday 11 PM ET (03:05 UTC Sunday)
    # Sunday to Friday at noon ET: the daily CFB update (odds included), and
    # an NFL run an hour before Sunday's early slate.
    - cron: "5 16 * * 0-5"
    # Sunday 9:35 AM ET: NFL lines and anytime TD prices for the 1 PM and
    # 4 PM slates, so a late GitHub start still lands before kickoff. The
    # noon run is the backup; it keeps TD prices pulled in the last 6 hours.
    - cron: "35 13 * * 0"
    # 7:15 PM ET, about an hour before the TNF, SNF and MNF kickoffs. Friday's
    # also takes CFB's last odds before the 9 PM ET lock. Tuesday's and
    # Wednesday's only refresh results and the site.
    - cron: "15 23 * * 0,1,4"
    - cron: "15 23 * * 2,3"
    - cron: "15 23 * * 5"
    # 1:35 AM ET Monday, Tuesday and Friday (12:35 AM in winter, EST): results
    # of the Sunday, Monday and Thursday night games, so they reach the home
    # page's Last night strip overnight instead of at the next noon run. Set
    # for EST so it still lands after those games end once clocks fall back
    # (Anthony, 2026-10-23). No odds; CFB uses its cache.
    - cron: "35 5 * * 1,2,5"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# This site's code lives in nfl-cfb/ of the one Sports Edge repo.
defaults:
  run:
    working-directory: nfl-cfb

# Every job is pinned to ubuntu-24.04 rather than ubuntu-latest, so GitHub's
# move of ubuntu-latest to Ubuntu 26.04 (Oct 19 - Nov 19, 2026) can't change
# the live runs underneath us. The weekly Python shadow test tries 26.04.
jobs:
  generate-and-publish-picks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A league whose season is over (shared/seasons.py, docs/season-end.md)
      # pulls no Vegas odds until 10 days before its next season's usual
      # start; the pages are still rebuilt. If this check breaks, odds are
      # pulled as usual.
      - name: Season check
        id: season
        continue-on-error: true
        run: |
          for lg in nfl cfb; do echo "$lg=$(python ../shared/seasons.py idle $lg)" >> "$GITHUB_OUTPUT"; done
          python ../shared/seasons.py

      # If nflverse (GitHub releases) is erroring, the fetch scripts retry,
      # then stop (exit 3) rather than predict from a partial pull. The NFL
      # steps below are then skipped, and the site is rebuilt from the last
      # tracking data, so an outage never posts wrong picks or a red run.
      - name: Fetch data
        id: fetch_data
        continue-on-error: true
        run: python src/fetch_data.py

      - name: Fetch injury report
        id: fetch_injuries
        if: steps.fetch_data.outcome == 'success'
        continue-on-error: true
        run: python src/fetch_injuries.py

      - name: Note a data outage
        if: steps.fetch_data.outcome != 'success' || steps.fetch_injuries.outcome != 'success'
        run: echo "NFL data (nflverse) didn't come through, so this run skipped NFL picks; the site keeps the last ones." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build features
        id: build_features
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/build_features.py

      - name: Build defense personnel value (feeds auto_defense_adjustments)
        id: build_defense_stats
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/build_defense_stats.py

      # data/raw/odds.csv isn't committed, so the last pull is carried
      # between runs; a run that skips the fetch predicts with those lines
      # (the trackers still lock each game's line at kickoff).
      - name: Restore last Vegas odds
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: nfl-cfb/data/raw/odds.csv
          key: nfl-odds-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nfl-odds-

      - name: Fetch Vegas odds
        id: fetch_odds
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success' && steps.season.outputs.nfl != 'yes' && ((github.event_name == 'schedule' && (github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '35 13 * * 0' || github.event.schedule == '15 23 * * 0,1,4')) || (github.event_name == 'workflow_dispatch' && inputs.odds) || hashFiles('nfl-cfb/data/raw/odds.csv') == '')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_odds.py

      - name: Save Vegas odds
        if: steps.fetch_odds.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nfl-cfb/data/raw/odds.csv
          key: nfl-odds-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Generate game predictions (model + market-blended sharp line)
        id: game_predictions
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/models/game_predictions.py

      - name: Generate player props
        id: player_props
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/models/props_predictions.py

      # Anytime TD prices, only for games kicking off within 12 hours whose
      # last pull is over 6 hours old (~18 credits a week, see the script).
      - name: Fetch anytime TD odds
        id: fetch_td_odds
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success' && steps.season.outputs.nfl != 'yes' && (github.event_name != 'workflow_dispatch' || inputs.odds)
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_td_odds.py

      - name: Track TD props
        id: track_td_props
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        continue-on-error: true
        run: python src/track_td_props.py

      - name: Compare to Vegas
        id: compare_vegas
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/models/compare_to_vegas.py

      - name: Sanity check output
        id: sanity_check
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/sanity_checks.py

      - name: Track prediction accuracy
        id: track_results
        if: steps.fetch_data.outcome == 'success' && steps.fetch_injuries.outcome == 'success'
        run: python src/track_results.py

      # CFBD responses carried between runs (src/fetch_cfb_data.py): finished
      # seasons are fetched once, so the 1,000-call monthly quota lasts.
      - name: Restore CFBD cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: nfl-cfb/data/raw/cfbd_cache
          key: cfbd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cfbd-

      # Fresh CFB data only on the runs that update CFB (the noon runs,
      # Friday's 7:15 PM and Saturday 11 PM ET, and manual runs). The others
      # rebuild from the cached copy; their scores come from ESPN.
      - name: Fetch CFB data
        id: fetch_cfb_data
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_CACHE_ONLY: ${{ !(github.event_name != 'schedule' || github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '15 23 * * 5' || github.event.schedule == '5 3 * * 0') && '1' || '' }}
        run: python src/fetch_cfb_data.py

      - name: Build CFB features
        id: build_cfb_features
        continue-on-error: true
        run: python src/build_cfb_features.py

      # CFB odds only on the daily noon run and Friday's last one before the
      # 9 PM ET lock (and manual runs with "odds" ticked), and only when the
      # CFB data fetch worked, so no credits go on lines while CFBD is down.
      # Other runs keep the logged lines.
      - name: Fetch CFB odds
        id: fetch_cfb_odds
        if: steps.season.outputs.cfb != 'yes' && steps.fetch_cfb_data.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.odds) || github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '15 23 * * 5')
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python src/fetch_cfb_odds.py

      - name: Generate CFB game predictions
        id: cfb_game_predictions
        continue-on-error: true
        run: python src/models/cfb_game_predictions.py

      - name: Compare CFB to Vegas
        id: compare_cfb_vegas
        continue-on-error: true
        run: python src/models/compare_cfb_to_vegas.py

      - name: Track CFB prediction accuracy
        id: track_cfb_results
        continue-on-error: true
        run: python src/track_cfb_results.py

      # Our own FBS power ratings (Ratings tab), tracked on their own and not
      # yet used by the picks. Same runs as the CFB odds plus Saturday 11 PM
      # ET, after the day's games, to keep CFBD calls down.
      - name: Update CFB power ratings
        id: cfb_ratings
        if: github.event_name != 'schedule' || github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '15 23 * * 5' || github.event.schedule == '5 3 * * 0'
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/cfb_ratings.py

      - name: Save CFBD cache
        if: always() && (github.event_name != 'schedule' || github.event.schedule == '5 16 * * 0-5' || github.event.schedule == '15 23 * * 5' || github.event.schedule == '5 3 * * 0')
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: nfl-cfb/data/raw/cfbd_cache
          key: cfbd-${{ github.run_id }}-${{ github.run_attempt }}

      # How the pick moved on each game page: a row each time a game's pick,
      # chance or Vegas line changed (shared/pick_moves.py), committed with
      # the tracking data below.
      - name: Save pick moves
        if: always() && steps.track_results.outcome == 'success'
        continue-on-error: true
        run: python ../shared/pick_moves.py football

      - name: Commit tracking data
        id: commit_tracking
        if: always() && steps.track_results.outcome == 'success'
        run: |
          git config user.name "nfl-edge-bot"
          git config user.email "actions@github.com"
          git add data/tracking/
          python ../shared/seasons.py archive || true  # freezes a season that just ended
          [ -d ../archive ] && git add ../archive
          git diff --cached --quiet && exit 0
          git commit -m "Update prediction tracking [skip ci]"
          git pull --rebase origin main
          git push

      - name: Build site
        id: build_site
        run: python src/build_site.py

      # NFL Edge's pages go to /nfl/ and CFB Edge's to /cfb/.
      - name: Publish site
        if: github.ref == 'refs/heads/main'
        run: ../publish_site.sh dist/nfl:nfl dist/cfb:cfb
