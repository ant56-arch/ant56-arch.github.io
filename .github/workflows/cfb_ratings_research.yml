name: CFB Ratings Backtest

# Scores the CFB power-rating settings on past seasons (src/cfb_ratings_lab.py):
# before each week, fit on the games before it, predict that week. Then does a
# dry run of src/cfb_ratings.py to show today's top teams. Only prints results;
# nothing is committed. Runs by hand only: a run with an empty cache costs
# dozens of CFBD calls against the 1,000-a-month quota.

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: nfl-cfb

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # CFBD responses carried between runs (src/fetch_cfb_data.py): finished
      # seasons are fetched once, so the 1,000-call monthly quota lasts.
      - name: Restore CFBD cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: nfl-cfb/data/raw/cfbd_cache
          key: cfbd-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cfbd-

      - name: Backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/cfb_ratings_lab.py

      - name: Dry run of today's ratings
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python src/cfb_ratings.py
          python -c "import json; d = json.load(open('data/tracking/cfb_ratings.json')); [print(t['overall_rank'], t['team'], t['record'], t['overall'], t['offense'], t['defense']) for t in d['teams'][:25]]"

      - name: Save CFBD cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: nfl-cfb/data/raw/cfbd_cache
          key: cfbd-${{ github.run_id }}-${{ github.run_attempt }}
