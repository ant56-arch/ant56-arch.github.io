name: CFB Ratings Backtest

# Scores the CFB power-rating settings (src/cfb_ratings.py) on past seasons:
# before each week, fit on the games before it, predict that week. Only prints
# results; nothing is committed. Runs by hand, or when a work branch changes
# the ratings code.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["nfl-cfb/src/cfb_ratings.py"]

defaults:
  run:
    working-directory: nfl-cfb

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backtest
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/cfb_ratings.py --backtest
